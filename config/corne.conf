# Battery level report interval in seconds
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=180

# Increase keyboard debounce
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Improve BLE reliability/range for the split link (right peripheral -> left central).
# The default TX power is 0 dBm; +8 dBm is recommended by ZMK for weak/spotty links.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# Prefer stability/range over 2 Mbps BLE throughput.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Change keyboard default display name
CONFIG_ZMK_KEYBOARD_NAME="CorneKB-AS"

# Fix battery report related bug on Windows
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# OLED/display config
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# Built-in display widgets
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
CONFIG_ZMK_WIDGET_WPM_STATUS=n

# Sleep config
# Milliseconds of inactivity before entering idle state (5 seconds default, 60 seconds to avoid
# wake-up lag during brief typing pauses e.g. on typing practice sites)
CONFIG_ZMK_IDLE_TIMEOUT=60000
# Enable deep sleep support
CONFIG_ZMK_SLEEP=y
# Milliseconds of inactivity before entering deep sleep (15 minutes)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Mouse/pointing config
CONFIG_ZMK_POINTING=y

# ZMK Studio config
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n

# RGB underglow config
CONFIG_ZMK_RGB_UNDERGLOW=y
# Keep RGB available, but off by default when the keyboard boots
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
# Turn off RGB when keyboard enters idle
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
# Turn off RGB when USB is disconnected
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=y
# Low default brightness if RGB is manually enabled
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=10
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=60
# Use solid effect so layer-specific HSB colors are visible
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
# Keep RGB toggle separate from external power toggle.
# RGB_TOG controls only LED state; EP_TOG controls OLED + RGB physical power rail.
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
