# Left half is the split BLE central and also the BLE peripheral to the host.

# Split link latency (right half -> left half).
# Default is 30 (~232 ms worst case); 0 = lowest latency.
CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=0

# Host link latency (left half -> computer).
# Default is 30 (~232 ms worst case for the first key after idle).
# Setting to 0 means the computer listens on every connection event.
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0

# Give bursts from the right half more room during BLE retransmits.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE=20
