# Left half is the split BLE central.
# Default split latency is 30 connection intervals (~232 ms worst case at 7.5 ms).
# Use low latency for testing/responsiveness; increase to 5-10 later if battery life is more important.
CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=0

# Give bursts from the right half more room during BLE retransmits.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE=20
